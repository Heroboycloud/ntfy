# Save as: .github/workflows/release-armv7-termux.yml
# Builds an ARMv7 (32-bit ARM) Android/Termux executable from Go code.
name: Build & Release ARMv7 Termux (Go)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NTFY_URL: https://ntfy.sh/az_alerts

jobs:
  armv7-termux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ------------------------------------------------------------ detect
      - name: Prepare tag and name
        id: d
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="armv7-build-${{ github.run_number }}"
          fi
          NAME="${{ github.event.repository.name }}"
          APP="${NAME//[^A-Za-z0-9._-]/-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Notify start
        continue-on-error: true
        run: |
          curl -fsS --max-time 15 \
            -H "Title: ARMv7 Termux build started" \
            -H "Tags: hammer_and_wrench" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "${{ github.repository }} @ ${GITHUB_SHA::7}. Tag: ${{ steps.d.outputs.tag }}" \
            "$NTFY_URL" || true

      # ------------------------------------------------------------- tools
      - uses: actions/setup-go@v6
        continue-on-error: true
        with:
          go-version: stable
          cache: false

      - name: Check preinstalled Android NDK
        id: ndkcheck
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -n "$NDK" ] && [ -d "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Android NDK (only if missing)
        if: steps.ndkcheck.outputs.have != 'true'
        continue-on-error: true
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      # ------------------------------------------------------------- build
      - name: Build ARMv7 Android binary
        id: build
        continue-on-error: true
        env:
          APP: ${{ steps.d.outputs.app }}
          TAGNAME: ${{ steps.d.outputs.tag }}
          GOTOOLCHAIN: auto
        run: |
          set -u
          echo ">>> workflow version: armv7-go v3 (embed placeholders enabled)"
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          [ -d "$NDK" ] || { echo "Android NDK not found"; exit 1; }
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          # API 21 = runs on Android 5.0+ (covers kernel 4.14 devices easily)
          CC_PATH="$BIN/armv7a-linux-androideabi21-clang"
          if [ ! -x "$CC_PATH" ]; then
            CC_PATH="$(ls "$BIN"/armv7a-linux-androideabi*-clang 2>/dev/null | sort | head -n1 || true)"
          fi
          [ -n "$CC_PATH" ] && [ -x "$CC_PATH" ] || { echo "NDK armv7a clang not found"; exit 1; }
          echo "Using compiler: $CC_PATH"

          # --- Create placeholders for //go:embed patterns that have no files yet
          # (e.g. ntfy: "server/server.go: pattern docs: no matching files found").
          # The docs/web app are generated by other build tools; a CLI build
          # only needs the directories to exist.
          mkdir -p server/docs server/site 2>/dev/null || true
          if [ -d server ]; then
            [ -n "$(find server/docs -type f -print -quit 2>/dev/null)" ] || touch server/docs/index.html
            [ -n "$(find server/site -type f -print -quit 2>/dev/null)" ] || touch server/site/app.html
          fi
          while IFS= read -r line; do
            file="${line%%:*}"
            rest="${line#*:}"
            dir="$(dirname "$file")"
            pats="${rest#*//go:embed}"
            for p in $pats; do
              p="${p#all:}"
              p="${p//\"/}"
              [ -n "$p" ] || continue
              target="$dir/$p"
              case "$p" in
                *[*?[]*)
                  if ! compgen -G "$target" > /dev/null; then
                    mkdir -p "$(dirname "$target")"
                    touch "$(dirname "$target")/placeholder.txt"
                  fi ;;
                *)
                  if [ -d "$target" ]; then
                    [ -n "$(find "$target" -type f -print -quit)" ] || touch "$target/index.html"
                  elif [ ! -e "$target" ]; then
                    case "$(basename "$p")" in
                      *.*) mkdir -p "$(dirname "$target")"; touch "$target" ;;
                      *)   mkdir -p "$target"; touch "$target/index.html" ;;
                    esac
                  fi ;;
              esac
            done
          done < <(grep -rn --include='*.go' '^[[:space:]]*//go:embed' . 2>/dev/null || true)

          echo "Embed placeholders in place:"
          find server/docs server/site -type f 2>/dev/null | head -n 5 || true

          if [ ! -f go.mod ]; then
            go mod init "github.com/${{ github.repository }}"
            go mod tidy || true
          else
            go mod download || true
          fi

          # Find the main package (root first, otherwise first "main" found)
          PKG="."
          ROOT_NAME="$(go list -f '{{.Name}}' . 2>/dev/null || true)"
          if [ "$ROOT_NAME" != "main" ]; then
            if grep -lq '^package main' ./*.go 2>/dev/null; then
              PKG="."
            else
              ALL_MAINS="$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./... 2>/dev/null || true)"
              ALL_MAINS="$(echo "$ALL_MAINS" | sed '/^$/d')"
              PKG="${ALL_MAINS%%$'\n'*}"
            fi
          fi
          [ -n "$PKG" ] || { echo "No main package found"; exit 1; }
          echo "Building package: $PKG"

          mkdir -p dist outbin
          export GOOS=android GOARCH=arm GOARM=7 CGO_ENABLED=1 CC="$CC_PATH"
          # No "netgo" tag on purpose: Android has no /etc/resolv.conf, so the
          # system (bionic) DNS resolver must be used for networking to work.
          go build -trimpath -buildmode=pie \
            -tags "sqlite_omit_load_extension,osusergo" \
            -ldflags "-s -w -X main.version=${TAGNAME} -X main.commit=${GITHUB_SHA::7} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "outbin/$APP" "$PKG" || exit 1

          chmod +x "outbin/$APP"
          INFO="$(file "outbin/$APP" || true)"
          echo "$INFO"
          case "$INFO" in
            *ARM*) ;;
            *) echo "Output is not an ARM binary"; exit 1 ;;
          esac
          tar -C outbin -czf "dist/$APP-termux-armv7.tar.gz" "$APP"
          cd dist && sha256sum * > checksums.txt
          ls -lh

      - name: Notify build result
        if: always()
        continue-on-error: true
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            T="Built OK: termux-armv7"; TAGS="white_check_mark"
          else
            T="Build FAILED: termux-armv7"; TAGS="x"
          fi
          curl -fsS --max-time 15 \
            -H "Title: $T" -H "Tags: $TAGS" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "${{ github.repository }} @ ${GITHUB_SHA::7}" \
            "$NTFY_URL" || true

      # ----------------------------------------------------------- release
      - name: Publish release
        if: steps.build.outcome == 'success'
        id: rel
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.d.outputs.tag }}
          name: ${{ steps.d.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: false
          files: dist/*
          body: |
            ## ARMv7 Android / Termux (32-bit ARM)
            Download `*-termux-armv7.tar.gz`, then in Termux:
            `tar -xzf <file>.tar.gz && ./<name>`

      - name: Notify final result
        if: always()
        continue-on-error: true
        run: |
          BASE="${{ github.server_url }}/${{ github.repository }}"
          TAG="${{ steps.d.outputs.tag }}"
          if [ "${{ steps.build.outcome }}" != "success" ] || [ "${{ steps.rel.outcome }}" != "success" ]; then
            curl -fsS --max-time 15 -H "Title: ARMv7 release FAILED" -H "Tags: rotating_light" \
              -H "Click: $BASE/actions/runs/${{ github.run_id }}" \
              -d "No release was published for ${{ github.repository }}. Check the logs." "$NTFY_URL" || true
            exit 0
          fi
          MSG="Release $TAG is live!"$'\n'"Page: $BASE/releases/tag/$TAG"
          for f in dist/*; do
            n=$(basename "$f")
            [ "$n" = "checksums.txt" ] && continue
            MSG="$MSG"$'\n'"- $n: $BASE/releases/download/$TAG/$n"
          done
          curl -fsS --max-time 15 \
            -H "Title: ARMv7 release ready: ${{ github.repository }}" \
            -H "Tags: rocket,tada" \
            -H "Click: $BASE/releases/tag/$TAG" \
            -H "Actions: view, Open release, $BASE/releases/tag/$TAG" \
            -d "$MSG" "$NTFY_URL" || true
